
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KaasuPay - Add Money</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #166534;
    }

    label {
      display: block;
      margin: 18px 0 8px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #15803d;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Add Money</h2>

    <label for="token">Authentication Token</label>
    <input
      id="token"
      type="password"
      placeholder="Paste your JWT token"
      autocomplete="off"
    />

    <label for="amount">Amount (₹)</label>
    <input
      id="amount"
      type="number"
      min="10"
      max="10000"
      step="1"
      placeholder="Enter amount"
    />

    <button id="addMoneyBtn">Add Money</button>

    <p id="message"></p>
  </div>

  <script>
    const tokenInput = document.getElementById("token");
    const amountInput = document.getElementById("amount");
    const button = document.getElementById("addMoneyBtn");
    const message = document.getElementById("message");

    button.addEventListener("click", async () => {
      const token = tokenInput.value.trim();
      const rupees = Number(amountInput.value);

      if (!token) {
        message.textContent = "Please enter your authentication token.";
        return;
      }

      if (
        !Number.isInteger(rupees) ||
        rupees < 10 ||
        rupees > 10000
      ) {
        message.textContent = "Enter an amount between ₹10 and ₹10,000.";
        return;
      }

      if (typeof Razorpay === "undefined") {
        message.textContent = "Razorpay Checkout could not load.";
        return;
      }

      button.disabled = true;
      message.textContent = "Creating payment order...";

      try {
        const orderResponse = await fetch(
          "/api/v1/wallet/add-money/order",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
              amount: rupees * 100
            })
          }
        );

        const orderData = await orderResponse.json();

        if (!orderResponse.ok) {
          throw new Error(orderData.error || "Could not create order.");
        }

        const options = {
          key: orderData.keyId,
          amount: orderData.amount,
          currency: orderData.currency,
          name: "KaasuPay",
          description: "Add money to your wallet",
          order_id: orderData.orderId,

          handler: async function (response) {
            message.textContent = "Verifying payment...";

            try {
              const verifyResponse = await fetch(
                "/api/v1/wallet/add-money/verify",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                  },
                  body: JSON.stringify(response)
                }
              );

              const verifyData = await verifyResponse.json();

              if (!verifyResponse.ok) {
                throw new Error(
                  verifyData.error || "Payment verification failed."
                );
              }

              message.textContent =
                verifyData.message || "Payment verified successfully.";
            } catch (error) {
              message.textContent = error.message;
            } finally {
              button.disabled = false;
            }
          },

          modal: {
            ondismiss: function () {
              message.textContent = "Payment window closed.";
              button.disabled = false;
            }
          },

          theme: {
            color: "#15803d"
          }
        };

        const checkout = new Razorpay(options);

        checkout.on("payment.failed", function (response) {
          message.textContent =
            response.error.description || "Payment failed.";
          button.disabled = false;
        });

        checkout.open();
        message.textContent = "Complete your payment in Razorpay.";
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
